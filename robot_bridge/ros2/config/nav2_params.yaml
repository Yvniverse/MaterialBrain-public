map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: warehouse_map
    yaml_filename: /opt/materialbrain/.runtime/warehouse.yaml
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      tolerance: 0.15
      max_planning_time: 4.0
      max_iterations: 1000000
      terminal_checking_interval: 500
      cost_penalty: 2.0
      rotation_penalty: 5.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      allow_reverse_expansion: true
      cache_obstacle_heuristic: false
      smooth_path: true
      analytic_expansion_max_length: 3.0
      lookup_table_size: 20.0
      lattice_filepath: /opt/materialbrain/.runtime/diff_drive_lattice.json
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 8.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.25
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.75
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: true
      closed_loop: true
      use_path_orientations: false
      motion_model: DiffDrive
      time_steps: 56
      model_dt: 0.05
      batch_size: 1600
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.3
      vx_max: 0.8
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 1.0
      ax_min: -1.5
      az_max: 1.5
      prune_distance: 2.0
      transform_tolerance: 0.25
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 1
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.2
        offset_from_furthest: 16
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 20
        threshold_to_consider: 0.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 20
        threshold_to_consider: 0.2
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.38,0.29],[0.38,-0.29],[-0.38,-0.29],[-0.38,0.29]]'
      footprint_padding: 0.09
      transform_tolerance: 0.25
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          max_obstacle_height: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.85
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: warehouse_map
      robot_base_frame: base_link
      update_frequency: 3.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: false
      footprint: '[[0.38,0.29],[0.38,-0.29],[-0.38,-0.29],[-0.38,0.29]]'
      footprint_padding: 0.09
      transform_tolerance: 0.25
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          max_obstacle_height: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.85
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: warehouse_map
    robot_base_frame: base_link
    transform_tolerance: 0.25
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: warehouse_map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
