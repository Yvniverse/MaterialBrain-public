name: Bug report
description: Report a reproducible MaterialBrain defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MaterialBrain. Do not include credentials or private company data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      placeholder: "git SHA or release tag"
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Redact secrets and private data before attaching evidence.
