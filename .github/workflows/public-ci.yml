name: Public CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: materialbrain_public_test
          POSTGRES_PASSWORD: materialbrain_public_test
          POSTGRES_DB: materialbrain_public_v02_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U materialbrain_public_test -d materialbrain_public_v02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://materialbrain_public_test:materialbrain_public_test@127.0.0.1:55432/materialbrain_public_v02_test
      DATABASE_URL: postgresql+psycopg://materialbrain_public_test:materialbrain_public_test@127.0.0.1:55432/materialbrain_public_v02_test
      MATERIALBRAIN_BUILD_SHA: ${{ github.sha }}
      JEV_ENABLED: "false"
      JEV_SHADOW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mcp.txt
      - run: pip install -r backend/requirements.txt
      - run: pip install --no-deps -r backend/requirements-mcp.txt
      - run: python tools/check_migration_history.py
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m ruff check app scripts tests warehouse_bench alembic
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: PHASE3_MCP_STDIO_RUN=1 python -m pytest tests/integration/test_mcp_stdio_e2e.py
        working-directory: backend
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check training robot_bridge/ros2 tests
      - run: python -m pytest robot_bridge/ros2/tests training/tests tests
        env:
          PYTHONPATH: backend:robot_bridge/ros2
      - run: python -m warehouse_bench --seed 17 --repetitions 1 --output warehouse_bench/results/ci
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
