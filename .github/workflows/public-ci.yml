name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: materialbrain_test
          POSTGRES_PASSWORD: materialbrain_test
          POSTGRES_DB: materialbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materialbrain_test -d materialbrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://materialbrain_test:materialbrain_test@127.0.0.1:5432/materialbrain_test
      DATABASE_URL: postgresql+psycopg://materialbrain_test:materialbrain_test@127.0.0.1:5432/materialbrain_test
      JEV_ENABLED: "false"
      JEV_SHADOW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mcp.txt
      - run: pip install -r backend/requirements.txt
      - run: pip install --no-deps -r backend/requirements-mcp.txt
      - run: python tools/check_migration_history.py
      - run: python -m alembic upgrade head
        working-directory: backend
      # The public snapshot intentionally omits private evaluation corpora and
      # harnesses; lint the published backend trees only.
      - run: python -m ruff check app scripts tests
        working-directory: backend
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
