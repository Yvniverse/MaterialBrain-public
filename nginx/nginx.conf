user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;

    upstream frontend { server frontend:80; }

    server {
        listen 80 default_server;
        server_name _ material.local;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        location = /api/v1/auth/login {
            limit_req zone=login burst=20 nodelay;
            limit_req_status 429;
            set $materialbrain_backend backend:8000;
            proxy_pass http://$materialbrain_backend;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            set $materialbrain_backend backend:8000;
            proxy_pass http://$materialbrain_backend;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { proxy_pass http://frontend; include /etc/nginx/proxy_params; }
    }
}
