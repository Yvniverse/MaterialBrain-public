name: materialbrain_public_v02

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      args:
        MATERIALBRAIN_BUILD_SHA: ${MATERIALBRAIN_BUILD_SHA:-unknown}
        MATERIALBRAIN_RELEASE_TAG: ${MATERIALBRAIN_RELEASE_TAG:-}
        MATERIALBRAIN_BUILD_TIME_UTC: ${MATERIALBRAIN_BUILD_TIME_UTC:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SPATIAL_ROBOT_BRIDGE_URL: http://robotics:8766
      SPATIAL_NAV2_EVIDENCE_DIR: /storage/robotics/qualification
      SPATIAL_SAMPLE_MAP_ENABLED: ${SPATIAL_SAMPLE_MAP_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      ATTACHMENT_DIR: /storage/attachments
      ENGINEERING_EVIDENCE_STORAGE_DIR: /storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_MODEL_POLICY: ${AGENT_MODEL_POLICY:-normal}
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.7-plus-2026-05-26}
      DASHSCOPE_ENABLE_THINKING: ${DASHSCOPE_ENABLE_THINKING:-false}
      DASHSCOPE_MODEL_POOL_ENABLED: ${DASHSCOPE_MODEL_POOL_ENABLED:-true}
      DASHSCOPE_FALLBACK_MODELS: ${DASHSCOPE_FALLBACK_MODELS:-qwen3.7-max-2026-06-08}
      DASHSCOPE_CERTIFIED_MODELS: ${DASHSCOPE_CERTIFIED_MODELS:-qwen3.7-plus-2026-05-26,qwen3.7-max-2026-06-08}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_API_BASE_URL: ${TYPESAFE_API_BASE_URL:-https://api.typesafe.ai}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_SHADOW_ENABLED: ${JEV_SHADOW_ENABLED:-false}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_STAGE_INPUT_TOKEN_CAP: ${JEV_STAGE_INPUT_TOKEN_CAP:-200000}
      JEV_STAGE_REQUEST_CAP: ${JEV_STAGE_REQUEST_CAP:-30}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-5}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-45}
      AGENT_TOTAL_DEADLINE_SECONDS: ${AGENT_TOTAL_DEADLINE_SECONDS:-90}
      AGENT_CONVERSATION_TTL_MINUTES: ${AGENT_CONVERSATION_TTL_MINUTES:-1440}
      AGENT_CONVERSATION_CLEANUP_GRACE_DAYS: ${AGENT_CONVERSATION_CLEANUP_GRACE_DAYS:-7}
      AGENT_DETERMINISTIC_MATERIAL_RESOLUTION_ENABLED: ${AGENT_DETERMINISTIC_MATERIAL_RESOLUTION_ENABLED:-false}
      AGENT_ENGINEERING_RESEARCH_ENABLED: ${AGENT_ENGINEERING_RESEARCH_ENABLED:-true}
      COMPONENT_INTELLIGENCE_ENABLED: ${COMPONENT_INTELLIGENCE_ENABLED:-false}
      TRACEABLE_ENGINEERING_EVIDENCE_REQUIRED: ${TRACEABLE_ENGINEERING_EVIDENCE_REQUIRED:-true}
      SAMPLE_DATA_SEED_ENABLED: ${SAMPLE_DATA_SEED_ENABLED:-false}
      SAMPLE_PRODUCT_SEED_ENABLED: ${SAMPLE_PRODUCT_SEED_ENABLED:-false}
      SAMPLE_RELATION_SEED_ENABLED: ${SAMPLE_RELATION_SEED_ENABLED:-false}
      SAMPLE_EVIDENCE_SEED_ENABLED: ${SAMPLE_EVIDENCE_SEED_ENABLED:-false}
      SAMPLE_CABLE_SEED_ENABLED: ${SAMPLE_CABLE_SEED_ENABLED:-false}
      SAMPLE_DATABASE_REBUILD_ENABLED: ${SAMPLE_DATABASE_REBUILD_ENABLED:-false}
    volumes:
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/attachments
        target: /storage/attachments
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/evidence
        target: /storage/evidence
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/imports
        target: /storage/imports
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/exports
        target: /storage/exports
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/robotics
        target: /storage/robotics
        read_only: true
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal, llm_egress]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BUILD_SHA: ${MATERIALBRAIN_BUILD_SHA:-unknown}
        VITE_RELEASE_TAG: ${MATERIALBRAIN_RELEASE_TAG:-}
        VITE_BUILD_TIME_UTC: ${MATERIALBRAIN_BUILD_TIME_UTC:-}
    restart: unless-stopped
    networks: [internal]

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [edge, internal]

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CRON: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      ATTACHMENT_DIR: /attachments
      EVIDENCE_DIR: /evidence
      BACKUP_DIR: /backups
    volumes:
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/backups
        target: /backups
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/attachments
        target: /attachments
        read_only: true
      - type: bind
        source: ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/evidence
        target: /evidence
        read_only: true
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]

  robotics:
    profiles: [robotics]
    build:
      context: .
      dockerfile: robot_bridge/ros2/Dockerfile
      args:
        GIT_COMMIT: ${MATERIALBRAIN_BUILD_SHA:-unknown}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-147}
      MATERIALBRAIN_BRIDGE_PORT: 8766
      MATERIALBRAIN_SIM_TIME_SCALE: 1.0
    expose: [8766]
    volumes:
      - ${MATERIALBRAIN_STORAGE_ROOT:-./storage}/robotics:/opt/materialbrain/.evidence
    healthcheck:
      test: [CMD, python3, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5))['ready']"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 12
    cpus: 3.0
    mem_limit: 4g
    networks: [internal, robotics_egress]

networks:
  edge:
    driver: bridge
  internal:
    internal: true
  llm_egress:
    driver: bridge
  robotics_egress:
    driver: bridge

volumes:
  postgres_data:
